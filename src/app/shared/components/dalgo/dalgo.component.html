<!-- Financial Diagnosis PDF download - ULB dashboards only. Placed above the
     dashboard so it's visible without scrolling past the (tall) embedded
     Superset iframe. -->
<div class="fd-download-container" *ngIf="dashboardType === USER_TYPE.ULB">
    <button type="button" class="fd-download-btn" (click)="downloadFinancialDiagnosisPdf()" [disabled]="isGeneratingPdf">
        <span class="material-icons fd-download-icon">download</span>
        {{ isGeneratingPdf ? 'Preparing PDF…' : 'Download Financial Diagnosis (PDF)' }}
    </button>
    <p class="fd-download-error" *ngIf="pdfGenerationError">{{ pdfGenerationError }}</p>
</div>

<div id="mohua-superset-container" class="container"></div>
<div class="text-start xv-fc-review-container" *ngIf="dashboardType === USER_TYPE.ULB">
    <p class="xv-fc-review-footnote">
        <span class="material-icons xv-fc-review-footnote-icon">info</span>
        <span>
            <a href="javascript:void(0)" class="xv-fc-review-link" (click)="goToXvFcReview()">Click here</a>
            to review your digitized data. You can edit it if any discrepancies are found. Once reviewed, you must accept the reported data, even if no changes are required.
        </span>
    </p>
</div>

<!-- Rendered off-screen; captured to PDF via html2canvas once data arrives. -->
<div class="fd-offscreen-container" aria-hidden="true">
    <app-financial-diagnosis-report [data]="financialDiagnosisData"></app-financial-diagnosis-report>
</div>
