    <section class="d-lg-block d-none py-2 border-bottom">
        <div class="container" style="max-width: 94%">
            <div class="row">
                <div class="col-sm-6">
                    <img src="/assets/images/emblem-of-india.svg" width="16" alt="Emblem
                      of India" srcset="" class="indian-emblem me-2" />
                    <span class="text-10px">MINISTRY OF HOUSING AND URBAN
                        AFFAIRS |
                        GOVERNMENT OF INDIA</span>
                </div>
                <div class="col-sm-6 text-end">
                    <span class="text-12px me-2"><a (click)="scroll()" class="text-decoration-none text-secondary">Skip
                            To
                            Main Content</a>
                    </span>
                    <ng-container *ngFor="let data of textSize">
                        <span (click)="setFontSize(data)" class="text-{{ data }}
                          textIcon" [ngClass]="currentTextSize == data ?
                          'active' : ''">A</span>
                    </ng-container>
                </div>
            </div>
        </div>
    </section>
    <nav class="navbar navbar-expand-lg navbar-light bg-white py-0" #stickyMenu [ngClass]="{'stiky-tp': isSticky}">
        <div class="container" style="max-width: 92%">
            <!-- Hamburger toggle for the shared off-canvas drawer (same mechanism as V2/SSR) -->
            <button type="button" class="mobile-nav-ham" aria-controls="primary-navigation"
                [attr.aria-expanded]="showMobileNav" aria-label="Toggle navigation" (click)="toggleMobileNav()">
                <i class="fs-4 bi bi-list"></i>
            </button>
            <a class="navbar-brand" href="/" [ngClass]="sticky ? 'show' : ''">
                <span class="city" style="font-size: 2rem;">city</span>
                <span class="fy" style="font-size: 2rem; color: #1D5290; font-weight: bold;">finance</span>
            </a>
            <div class="d-flex flex-grow-1 align-items-center justify-content-end">
                <!-- Renders as the desktop bar or the sliding drawer, CSS-only switch. -->
                <ul id="primary-navigation" class="primary-navigation navbar-nav ms-auto mb-2 mb-lg-0"
                    [ngClass]="showMobileNav ? 'primary-navigation-data-visible' : ''">

                    <button *ngIf="showMobileNav" type="button" class="mobile-nav-cancel"
                        aria-controls="primary-navigation" [attr.aria-expanded]="showMobileNav"
                        aria-label="Close navigation" (click)="toggleMobileNav()">
                        <i class="fs-4 bi bi-x-lg"></i>
                    </button>

                    <ng-container *ngFor="let menu of menus; trackBy: trackByMenuId">
                        <!-- Dropdown branch (menu.children present) -->
                        <li class="nav-item dropdown" *ngIf="menu.children?.length">
                            <a class="nav-link dropdown-toggle" href="#" [attr.id]="'navbarDropdown-' + menu.id"
                                role="button" data-bs-toggle="dropdown" aria-expanded="false"
                                [class.active]="menu.isActiveRoute">
                                <i *ngIf="menu.icon" [class]="menu.icon"></i>
                                <span [innerHTML]="menu.label"></span>
                            </a>
                            <ul class="dropdown-menu" [attr.aria-labelledby]="'navbarDropdown-' + menu.id">
                                <li *ngFor="let child of menu.children">
                                    <a class="dropdown-item" *ngIf="child.resolvedLink" [routerLink]="child.resolvedLink"
                                        [class.active]="child.isActiveRoute" (click)="closeMobileNav()">
                                        <i *ngIf="child.icon" [class]="child.icon"></i>
                                        <span [innerHTML]="child.label"></span>
                                    </a>
                                    <a class="dropdown-item" *ngIf="!child.resolvedLink" [attr.href]="child.resolvedHref"
                                        [attr.target]="child.target || '_self'" (click)="closeMobileNav()">
                                        <i *ngIf="child.icon" [class]="child.icon"></i>
                                        <span [innerHTML]="child.label"></span>
                                    </a>
                                </li>
                            </ul>
                        </li>

                        <!-- Button branch (menu.renderAs === 'button') -->
                        <li class="nav-item" *ngIf="!menu.children?.length && menu.renderAs === 'button'">
                            <button type="button" class="btn" [ngClass]="menu.buttonClass || 'btn-cfPrimary fw-bold'"
                                [routerLink]="menu.resolvedLink" (click)="closeMobileNav()">
                                <i *ngIf="menu.icon" [class]="menu.icon"></i>
                                <span [innerHTML]="menu.label"></span>
                            </button>
                        </li>

                        <!-- Image branch (menu.imageUrl) — UI's existing cityLogo item -->
                        <li class="nav-item" *ngIf="!menu.children?.length && menu.renderAs !== 'button' && menu.imageUrl">
                            <a class="navbar-brand cityLogo" *ngIf="menu.resolvedLink" [routerLink]="menu.resolvedLink"
                                (click)="closeMobileNav()">
                                <img style="height: 28px;" [src]="menu.imageUrl" [alt]="menu.imageAlt" />
                            </a>
                            <a class="navbar-brand cityLogo" *ngIf="!menu.resolvedLink" [attr.href]="menu.resolvedHref"
                                [attr.target]="menu.target || '_self'" (click)="closeMobileNav()">
                                <img style="height: 28px;" [src]="menu.imageUrl" [alt]="menu.imageAlt" />
                            </a>
                        </li>

                        <!-- Plain link branch (default) -->
                        <li class="nav-item" *ngIf="!menu.children?.length && menu.renderAs !== 'button' && !menu.imageUrl">
                            <a class="nav-link" *ngIf="menu.resolvedLink" [routerLink]="menu.resolvedLink"
                                [class.active]="menu.isActiveRoute" (click)="closeMobileNav()">
                                <i *ngIf="menu.icon" [class]="menu.icon"></i>
                                <span [innerHTML]="menu.label"></span>
                            </a>
                            <a class="nav-link" *ngIf="!menu.resolvedLink" [attr.href]="menu.resolvedHref"
                                [attr.target]="menu.target || '_self'" [innerHTML]="menu.label"
                                (click)="closeMobileNav()"></a>
                        </li>
                    </ng-container>
                    <button *ngIf="!isLoggedIn" type="button" class="demo-btn me-2" (click)="showRequestDemoPopup()">Request a
                        Demo</button>
                </ul>
            </div>
            <div class="ms-auto">
                <div class="dropdown" *ngIf="isLoggedIn == false">
                    <button class="btn btn-login dropdown-toggle fw-bold" type="button" id="loginDrp"
                        data-bs-toggle="dropdown" aria-expanded="false">
                        Login
                    </button>
                    <ul class="dropdown-menu dropdown-menu-login" aria-labelledby="loginDrp">
                        <li>
                            <a class="dropdown-item" (click)="loginLogout('XVIFC_coming_soon')">
                                <i class="bi bi-rocket-takeoff-fill text-new-badge"></i>
                            <span class="fw-bold"> XVI FC Grant</span>
                            <span class="new-badge-pill">New</span>
                        </a>
                        </li>
                        <hr class="m-0">
                        <li><a class="dropdown-item" (click)="loginLogout('15thFC')">
                                <span class="material-icons">
                                    login
                                </span> XV FC Grant
                            </a>
                        </li>
                        <hr class="m-0">
                        <li><a class="dropdown-item" (click)="loginLogout('state-dashboard')">
                                <span class="material-icons">
                                    login
                                </span> State Dashboard
                            </a>
                        </li>
                        <hr class="m-0">
                        <li><a class="dropdown-item" (click)="loginLogout('XVIFC')">
                                <span class="material-icons">
                                    login
                                </span> XVI FC Data Collection
                            </a>
                        </li>
                        <hr class="m-0">
                        <li><a class="dropdown-item" (click)="loginLogout('ranking')">
                                <span class="material-icons">
                                    login
                                </span> Rankings 2022
                            </a></li>
                    </ul>
                </div>
                <div class="btn-group ms-2" dropdown *ngIf="isLoggedIn">
                    <button id="button-disabled-menu" dropdownToggle type="button"
                        class="btn btn-login-icon dropdown-toggle" aria-controls="dropdown-disabled-menu">
                        <span class="material-icons">
                            account_circle
                        </span>
                        <span class="caret"></span>
                    </button>
    
                    <ul id="dropdown-disabled-menu" *dropdownMenu class="dropdown-menu" role="menu"
                        aria-labelledby="button-disabled-menu" style="margin-left: -7rem">
                        <li role="menuitem" style="padding: 0 1rem;" class="mb-3">
                            <div class="user-avt text-center" style="font-size:
                              2.5rem">
                                <i class="fa fa-user-circle"></i>
                            </div>
                            <div class="text-center">{{ user?.name }}</div>
                            <div class="mat-card-subtitle text-center" style="font-size:
                              0.9rem">
                                {{ user?.email }}
                            </div>
                        </li>
                        <li class="divider dropdown-divider"></li>
                        <li role="menuitem" *ngIf="user?.role !== 'PMU'">
                            <a class="dropdown-item text-center" routerLink="/user/profile/view">Profile</a>
                        </li>
                        <li class="divider dropdown-divider"></li>
                        <li role="menuitem"><a class="dropdown-item text-center"
                                (click)="loginLogout('logout')">Logout</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <!-- Persistent top bar: Request a Demo / Login / account controls — NEVER inside the drawer -->
    </nav>
